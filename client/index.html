<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gurmad V2</title>
    <!-- Customer Portal Mobile App — Implementation Spec §11. scope:"/portal"
         in the manifest itself means this link is inert for the staff app
         (a browser only offers install when the current page is within the
         manifest's scope) — no separate manifest file needed per app. -->
    <link rel="manifest" id="v2-manifest-link" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2F7D3E" />
    <!-- Gap-audit fix (Phase 10, user-requested: staff/customer mobile
         apps should feel like real mobile apps): both manifests above had
         "icons": [] — most browsers refuse the install prompt entirely
         without at least a 192x192 and a 512x512 icon, so neither app was
         actually installable to begin with, PWA infrastructure (manifest
         swap, service worker registration) notwithstanding. iOS Safari
         additionally ignores manifest icons for the home-screen icon and
         needs its own apple-touch-icon link. favicon.png doubles as the
         browser-tab icon for the plain (non-installed) staff app too. -->
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fleet-manifest login redesign (user-requested "not AI-generated,
         fits waste collection"). Scoped to the 3 login screens only via
         inline fontFamily there — the app-wide --font-display/--font-body
         tokens in design-system/tokens.css are untouched, so no other
         page's typography changes. Oswald = condensed industrial display
         face (route-signage feel); JetBrains Mono = manifest/dispatch
         data labels. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Field Collector Mobile — Implementation Spec §19. A single
      // <link rel="manifest"> tag is honored per document, so the href is
      // swapped at runtime based on the current path — additive to, not a
      // replacement of, the existing Portal-scoped default below. Only one
      // of the two manifests is ever active for a given page load.
      if (window.location.pathname.startsWith('/collector')) {
        document.getElementById('v2-manifest-link').setAttribute('href', '/collector-manifest.webmanifest');
      }

      // Service worker registration is gated per-app — neither registers
      // itself for the other's or the plain staff app's own routes.
      if ('serviceWorker' in navigator) {
        if (window.location.pathname.startsWith('/portal')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/portal' }).catch(() => {
              // Non-critical — the portal remains fully usable without a
              // registered service worker, just not installable as a PWA.
            });
          });
        } else if (window.location.pathname.startsWith('/collector')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/collector-sw.js', { scope: '/collector' }).catch(() => {
              // Non-critical — the app remains fully usable without a
              // registered service worker, just not installable as a PWA.
            });
          });
        }
      }
    </script>
  </body>
</html>
