server {
    server_name gurmadwaste.com www.gurmadwaste.com;

    # GURMAD V2 frontend (React build)
    location / {
        root /home/zakariye/gurmad-v2/client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # GURMAD V2 backend API
    location /api/ {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gurmadwaste.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gurmadwaste.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gurmadwaste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gurmadwaste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gurmadwaste.com www.gurmadwaste.com;
    return 404; # managed by Certbot
}
